<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>English Lab | Units 1 & 2</title><style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#0c1326;color:#edf5ff}*{box-sizing:border-box}body{margin:0}main{max-width:980px;margin:auto;padding:24px 16px 60px}h1{font-size:clamp(2rem,5vw,3rem);margin:.2em 0}p,.muted{color:#aac0d6}a{color:#82e7c8}.stats,nav,.actions{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}.stat,.panel{background:#18243a;border:1px solid #344862;border-radius:16px;padding:18px}.stat strong{display:block;font-size:22px}button,input{font:inherit;border:1px solid #426080;border-radius:10px;background:#22344f;color:#edf5ff;padding:10px 14px}button{cursor:pointer}button:hover,button:focus-visible,input:focus-visible{outline:2px solid #82e7c8}.selected,.primary{background:#82e7c8;color:#082d2a;font-weight:700}.panel{margin-top:18px}.question{border-top:1px solid #344862;padding:14px 0}.question label{display:block;margin-bottom:8px}.question input{width:min(100%,460px)}.choices{display:flex;gap:8px;flex-wrap:wrap}.choice{min-width:55px}.feedback{margin-top:8px;min-height:18px;font-weight:650}.good{color:#82e7c8}.bad{color:#ffb6a5}.bank{background:#22344f;border-radius:10px;padding:12px;line-height:1.8;color:#d9e9f7}.bar{height:10px;border-radius:30px;background:#344862;overflow:hidden}.fill{background:#82e7c8;height:100%;width:0}nav button{flex:1 1 120px}small{color:#aac0d6}@media(max-width:600px){.stat{flex:1 1 90px;padding:12px}nav button{padding:10px 8px;font-size:13px}}</style></head><body><main>
<a href="index.html">← Home</a><h1>English Lab</h1><p>Units 1 &amp; 2 · Vocabulary, Grammar, Functional Language &amp; Reading</p>
<div class="stats"><div class="stat"><strong id="done">0</strong>Answered</div><div class="stat"><strong id="right">0</strong>Correct</div><div class="stat"><strong id="pct">—</strong>Accuracy</div></div><div class="bar"><div class="fill" id="fill"></div></div>
<nav id="tabs"></nav><section class="panel" id="exercise"></section><div class="actions"><button id="check" class="primary">Check answers</button><button id="next">Next exercise →</button><button id="reset">Reset progress</button></div><p class="muted">Answers and progress are saved on this device. Word answers ignore capital letters and outer punctuation. Sentence corrections are checked against model answers.</p></main>
<script>
'use strict';const groups=[{"title":"Vocabulary · Word bank","instruction":"Complete the sentences using the word bank. Two words are extra.","bank":"Brazil · awful · hungry · clean · expensive · excited · hot · old · Russian · Spain · Spanish · thirsty","items":[["I haven't eaten breakfast. I'm ____.","hungry"],["Anna is from St Petersburg. She's ____.","Russian"],["Can I have some water? I'm ____.","thirsty"],["This film is terrible. It's ____!","awful"],["My grandfather is 80. He's ____.","old"],["Pedro is from Barcelona. He's ____.","Spanish"],["It's 35°C outside. I'm really ____.","hot"],["This phone costs £900. It's very ____.","expensive"],["Rio de Janeiro is a famous city in ____.","Brazil"],["We're going to London tomorrow. We're very ____!","excited"]]},{"title":"Vocabulary · Missing letters","instruction":"Complete each missing word.","items":[["The Italian f____ is green, white and red.","flag"],["Maria is from Germany. She speaks G____.","German"],["Your shoes are d____. Please clean them.","dirty"],["I can't buy this bike. It's too e____.","expensive"],["The t____ leaves the station at nine o'clock.","train"],["We're going on holiday tomorrow. I'm e____!","excited"],["I love Ed Sheeran. He's my f____ singer.","favourite|favorite"],["This is a great c____ game. I play it every day.","computer"],["There's nothing interesting on TV. I'm b____.","bored"],["At Halloween, children wear c____ and visit houses.","costumes"]]},{"title":"Grammar · Word bank","instruction":"Complete the sentences using the word bank.","bank":"Am · don't · from · her · How · isn't · it · us · Where · Why","items":[["Tom and Lucy are in the garden. ____ are their parents?","Where"],["This is my new phone. I really like ____.","it"],["Emma is my sister. I love ____ very much.","her"],["____ old is your cousin?","How"],["I ____ like cold weather.","don't"],["A: ____ are you happy? B: Because it's my birthday.","Why"],["____ I in the correct classroom?","Am"],["My brother doesn't like football. It ____ his favourite sport.","isn't"],["We're in the kitchen. Come and help ____.","us"],["My new friend is ____ Portugal.","from"]]},{"title":"Grammar · Correct the mistake","instruction":"Rewrite the entire sentence correctly.","items":[["I not like pizza.","I don't like pizza."],["How many old are you?","How old are you?"],["Is they from France?","Are they from France?"],["This aren't my schoolbag.","This isn't my schoolbag."],["She's the new girl in our class. I like she.","She's the new girl in our class. I like her."],["Who your favourite actor?","Who is your favourite actor?|Who's your favourite actor?"],["The Spain flag is red and yellow.","The Spanish flag is red and yellow."],["I like a basketball. It's my favourite sport.","I like basketball. It's my favourite sport."],["I'm from in Ljubljana.","I'm from Ljubljana."],["Yes, please. I very hungry.","Yes, please. I'm very hungry.|Yes, please. I am very hungry."]]},{"title":"Functional language · Dialogues","instruction":"Enter the missing word in each dialogue.","items":[["A: Who ____ he?","is"],["B: He's Pablo. He's ____ Argentina.","from"],["A: ____ are your friends from?","Where"],["B: Italy. They ____ Italian.","are"],["A: ____ you like Billie Eilish?","Do"],["B: Yes, I do. She ____ a fantastic singer.","is"],["A: I ____ like this song. It's terrible!","don't"],["B: Really? I ____ it. It's great!","like"],["A: Do you like ____ shoes?","these|those|my"],["B: Yes. Are ____ new?","they"],["A: Here's my train. ____, Dad!","Bye"],["B: Bye! ____ you tomorrow.","See"],["A: This is Daniel. ____ is my best friend.","He"],["B: Hello, Daniel. Nice to ____ you!","meet"]]},{"title":"Reading · Conversations","instruction":"Choose the best response.","items":[["What's your favourite subject?",["I'm 12 years old.","It's English.","Yes, I am."],1],["Is your sister at home?",["Yes, she is.","Yes, I am.","Yes, they are."],0],["Do you like Harry Styles?",["Yes, I am.","Yes, I like him.","No, he isn't."],1],["Where is your best friend from?",["She's 13.","Yes, she is.","She's from Croatia."],2],["Are your parents teachers?",["Yes, we are.","Yes, he is.","Yes, they are."],2]]},{"title":"Reading · About Sophie","instruction":"Choose the correct word to complete the sentence.","items":[["Hello! My name ____ Sophie.",["am","are","is"],2],["Today ____ my first day at school.",["are","is","am"],1],["I ____ 13 years old.",["am","is","are"],0],["I am ____ school with my friends.",["on","at","to"],1],["I love Taylor Swift. She's a(n) ____ singer.",["terrible","awful","amazing"],2],["I ____ like maths very much.",["don't","isn't","aren't"],0]]}],KEY="english-lab-units-1-2-v1";let saved={};try{saved=JSON.parse(localStorage.getItem(KEY))||{}}catch{}let answers=saved.answers||{},marks=saved.marks||{},tab=0;
const el=id=>document.getElementById(id);const key=(g,i)=>g+"-"+i;
function norm(s){return String(s||"").trim().toLowerCase().replace(/[’]/g,"'").replace(/\s+/g," ").replace(/[.!?]+$/,"").trim()}
function total(){return groups.reduce((n,g)=>n+g.items.length,0)}
function valid(g,i,v){const it=groups[g].items[i];return typeof it[1]==="string"?it[1].split("|").some(x=>norm(x)===norm(v)):Number(v)===it[2]}
function persist(){try{localStorage.setItem(KEY,JSON.stringify({answers,marks}))}catch{}}
function stats(){const n=Object.keys(marks).length,c=Object.values(marks).filter(Boolean).length;el("done").textContent=n+" / "+total();el("right").textContent=c;el("pct").textContent=n?Math.round(100*c/n)+"%":"—";el("fill").style.width=100*n/total()+"%"}
function node(tag,cls,txt){const x=document.createElement(tag);if(cls)x.className=cls;if(txt!==undefined)x.textContent=txt;return x}
function draw(){const tabs=el("tabs");tabs.replaceChildren();groups.forEach((g,i)=>{const b=node("button",i===tab?"selected":"",String(i+1)+". "+g.title.split(" · ")[0]);b.onclick=()=>{tab=i;draw()};tabs.append(b)});
const g=groups[tab],panel=el("exercise");panel.replaceChildren(node("h2","",g.title),node("p","muted",g.instruction));if(g.bank)panel.append(node("div","bank",g.bank));
g.items.forEach((it,i)=>{const k=key(tab,i),q=node("div","question");q.append(node("label","",String(i+1)+". "+it[0]));if(Array.isArray(it[1])){const choices=node("div","choices");it[1].forEach((opt,j)=>{const b=node("button","choice"+(answers[k]===String(j)?" selected":""),String.fromCharCode(65+j)+". "+opt);b.onclick=()=>{answers[k]=String(j);delete marks[k];persist();draw()};choices.append(b)});q.append(choices)}
else{const inp=node("input");inp.setAttribute("autocomplete","off");inp.setAttribute("aria-label","Answer "+(i+1));inp.value=answers[k]||"";inp.oninput=()=>{answers[k]=inp.value;delete marks[k];persist();stats()};q.append(inp)}
if(k in marks){const ok=marks[k],f=node("div","feedback "+(ok?"good":"bad"),ok?"✓ Correct":"✗ Correct answer: "+(Array.isArray(it[1])?it[1][it[2]]:it[1].split("|")[0]));q.append(f)}panel.append(q)});stats()}
el("check").onclick=()=>{groups[tab].items.forEach((it,i)=>{const k=key(tab,i);marks[k]=valid(tab,i,answers[k])});persist();draw()};
el("next").onclick=()=>{tab=(tab+1)%groups.length;draw();window.scrollTo({top:0,behavior:"smooth"})};
el("reset").onclick=()=>{if(confirm("Delete all saved answers and scores?")){answers={};marks={};persist();draw()}};
draw();</script></body></html>
